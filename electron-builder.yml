appId: com.evrohq.ytdownloader
productName: EvroHQ Downloader
# Highest compression for both the NSIS installer and the portable build.
# `compression` is a global electron-builder setting (no per-target key exists);
# it applies to every configured target. Trades a bit of build time for size.
compression: maximum
directories:
  output: release
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  # Strip dev artifacts, docs, tests and TS sources that sneak into node_modules.
  - '!**/{.git,.gitignore,.gitattributes}'
  - '!**/{thumbs.db,.DS_Store}'
  - '!**/node_modules/*/{test,tests,__tests__,spec,docs,documentation,example,examples,demo}/**'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,LICENSE,license,.eslintrc*,.prettierrc*}'
  - '!**/node_modules/**/*.{ts,map}'
  # Do NOT pack the source resources/ dir into app.asar. The binaries are shipped
  # via extraResources below (and read from process.resourcesPath/bin at runtime);
  # the window icon is inlined into out/ by electron-vite's ?asset import. Packing
  # resources/ here previously produced a redundant ~115 MB second copy of the exes.
  - '!resources/**'
  # Defense-in-depth: never pack the CI binary-download scratch files into app.asar.
  # (The release workflow extracts ffmpeg into ffmpeg_tmp/ and downloads ffmpeg.zip.)
  - '!ffmpeg.zip'
  - '!ffmpeg_tmp/**'
  - '!*.zip'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '*.exe'
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
publish:
  provider: github
  owner: EvroHQ
  repo: EvroHQ-Downloader
  releaseType: draft
